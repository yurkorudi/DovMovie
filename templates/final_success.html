<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <title>квиток</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/success.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  {% include 'header.html' %}

  <main class="sucsess">
    {% if success_pay == 'True' %}
    <h1 class='h1'>Операція успіщна</h1>
    <div class="ticket-pdf">
      <embed id="ticket" src="{{ url_for('ticket_pdf') }}?order_id={{ order_id }}">
    </div>
    {% else %}
    <h1 class='h1'>Не вдалося провести транзакцію</h1>
    {% endif %}
    <div class="sucsess-button">
      {% if success_pay == 'True' %}
      <button class="btn btn-load" onclick="load()">Завантажити квиток</button>
      {% endif %}
      <button class="btn btn-return" onclick="home()">Повернутися на головну</button>
    </div>
  </main>

  {% include 'footer.html' %}

  <script>

    console.log("success: " + '{{ success_pay }}');
    console.log("info: " + '{{ info }}');

    window.onload = function () {
      console.log("info: " + '{{ info }}');
    };

    function home() {
      window.location.href = 'https://www.dovzhenko-center.lviv.ua/en/movies';
    }

    async function load() {
      try {
        const pdfUrl = document.getElementById("ticket").src;

        const response = await fetch(pdfUrl);
        if (!response.ok) {
          throw new Error("Не вдалося отримати PDF");
        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "ticket.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>

</html>
